name: Deploy to Azure VM
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      reason:
        description: "Reason for deployment"
        required: true
      confirm:
        description: 'Type "deploy" to confirm'
        required: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"
  JAR_DIR: /opt/socius
  LOG_DIR: /var/log/socius

jobs:
  validate:
    name: Validate Input
    runs-on: ubuntu-latest
    steps:
      - name: Check Confirmation
        run: |
          if [[ "${{ inputs.confirm }}" != "deploy" ]]; then
            echo "❌ Deployment cancelled. Confirmation required."
            exit 1
          fi
          echo "✅ Deployment confirmed by ${{ github.actor }}"

  pre-check:
    name: Pre-Deployment Checks
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check VM Resources
        uses: appleboy/ssh-action@v1.2.0
        env:
          JAR_DIR: ${{ env.JAR_DIR }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: JAR_DIR
          script: |
            set -euo pipefail
            echo "Checking Server Status..."
            
            # 1. Check Disk Space (Min 1GB)
            AVAILABLE=$(df "$JAR_DIR" | tail -1 | awk '{print $4}')
            if [ "$AVAILABLE" -lt 1048576 ]; then
              echo "❌ Insufficient disk space"
              exit 1
            fi
            
            # 2. Check Java Version
            if ! java -version 2>&1 | grep -q "17\."; then
              echo "❌ Java 17 required"
              exit 1
            fi
            
            echo "✅ Server ready"

  build:
    name: Build Applications
    runs-on: ubuntu-latest
    needs: pre-check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar -x test --parallel --build-cache

      - name: Prepare JARs for Upload
        run: |
          # Create a clean artifacts directory
          mkdir -p ./upload-artifacts
          
          # Find and copy JARs (excluding *-plain.jar)
          MVC_JAR=$(find socius-mvc-app/build/libs -name '*.jar' ! -name '*-plain.jar' -type f | head -1)
          WEBFLUX_JAR=$(find socius-webflux-app/build/libs -name '*.jar' ! -name '*-plain.jar' -type f | head -1)
          
          if [[ -z "$MVC_JAR" || -z "$WEBFLUX_JAR" ]]; then
            echo "❌ JAR files not found"
            exit 1
          fi
          
          # Copy with original names to upload directory
          cp "$MVC_JAR" ./upload-artifacts/
          cp "$WEBFLUX_JAR" ./upload-artifacts/
          
          echo "✅ JARs ready for upload:"
          ls -lh ./upload-artifacts/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: application-jars
          path: ./upload-artifacts/*.jar
          retention-days: 1

  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: ${{ inputs.environment }}
      url: https://socius.codes/mvc/
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: application-jars
          path: ./artifacts

      - name: Debug - List downloaded files
        run: |
          echo "Files in ./artifacts:"
          ls -lah ./artifacts/

      - name: Transfer JARs
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "artifacts/*.jar"
          target: "/tmp/socius-deploy"
          strip_components: 1
          overwrite: true

      - name: Execute Deployment
        uses: appleboy/ssh-action@v1.2.0
        env:
          JAR_DIR: ${{ env.JAR_DIR }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 5m
          envs: JAR_DIR
          script: |
            set -euo pipefail
            echo "Starting deployment..."
            
            # Debug: Check received files
            echo "Files in /tmp/socius-deploy:"
            ls -lah /tmp/socius-deploy/
            
            # 1. Backup existing JARs
            BACKUP_DIR="$JAR_DIR/backups/$(date +%Y%m%d_%H%M%S)"
            sudo mkdir -p "$BACKUP_DIR"
            sudo cp "$JAR_DIR"/*.jar "$BACKUP_DIR/" 2>/dev/null || true
            
            # Cleanup old backups (Keep last 5)
            cd "$JAR_DIR/backups" && ls -t | tail -n +6 | xargs -I {} sudo rm -rf "{}" 2>/dev/null || true
            
            # 2. Move new JARs
            sudo mv /tmp/socius-deploy/*.jar "$JAR_DIR/" || {
              echo "❌ Failed to move JAR files"
              ls -lah /tmp/socius-deploy/
              exit 1
            }
            
            # Rename to standard names
            cd "$JAR_DIR"
            for jar in socius-mvc-app-*.jar; do
              [[ -f "$jar" ]] && sudo mv "$jar" socius-mvc-app.jar
            done
            for jar in socius-webflux-app-*.jar; do
              [[ -f "$jar" ]] && sudo mv "$jar" socius-webflux-app.jar
            done
            
            # 3. Set Permissions
            sudo chown azureuser:azureuser "$JAR_DIR"/*.jar
            sudo chmod 500 "$JAR_DIR"/*.jar
            
            # 4. Restart Services with Rollback
            restart_service() {
              local svc=$1
              echo "Restarting $svc..."
              if ! sudo systemctl restart "$svc"; then
                 echo "❌ Failed to restart $svc. Rolling back..."
                 sudo cp "$BACKUP_DIR"/*.jar "$JAR_DIR/"
                 sudo systemctl restart socius-mvc.service
                 sudo systemctl restart socius-webflux.service
                 exit 1
              fi
            }
            
            restart_service "socius-mvc.service"
            restart_service "socius-webflux.service"
            
            # Cleanup Tmp
            sudo rm -rf /tmp/socius-deploy
            echo "✅ Deployment successful"

      - name: Health Checks
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            echo "🏥 Running Health Checks..."
            sleep 15 # Wait for Java startup
            
            check_health() {
              local name=$1
              local url=$2
              echo "Checking $name at $url..."
              if curl -sf "$url" | grep -q '"status":"UP"'; then
                echo "✅ $name is UP"
                return 0
              else
                echo "❌ $name is DOWN"
                return 1
              fi
            }
            
            # --- INTERNAL CHECKS ---
            # MVC: Has context-path /api
            check_health "MVC (Internal)" "http://localhost:8080/api/actuator/health" || exit 1
            
            # WebFlux: No context-path
            check_health "WebFlux (Internal)" "http://localhost:8081/actuator/health" || exit 1
            
            # --- EXTERNAL CHECKS (Via Nginx) ---
            # MVC: Mapped via /mvc/ -> /api/
            check_health "MVC (External)" "https://socius.codes/mvc/actuator/health" || exit 1
            
            # WebFlux: Mapped via /flux/ -> /
            check_health "WebFlux (External)" "https://socius.codes/flux/actuator/health" || exit 1
            
            echo "✅ System Healthy"

      - name: Record History
        if: success()
        uses: appleboy/ssh-action@v1.2.0
        env:
          LOG_DIR: ${{ env.LOG_DIR }}
          ENVIRONMENT: ${{ inputs.environment }}
          ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: LOG_DIR,ENVIRONMENT,ACTOR
          script: |
            LOG="$LOG_DIR/deployment-history.log"
            sudo mkdir -p "$(dirname "$LOG")"
            echo "$(date '+%Y-%m-%d %H:%M:%S') | Env: $ENVIRONMENT | User: $ACTOR | Status: SUCCESS" | sudo tee -a "$LOG"