[versions]
# Core
java = "17"
springBoot = "3.5.6"
springDependencyManagement = "1.1.7"
springModulith = "1.4.3"

# Database & Persistence
mybatis = "3.0.5"
postgresql = "42.7.5"

# Mapping & Utils
mapstruct = "1.5.5.Final"
lombok = "1.18.30"
commonsLang3 = "3.19.0"

# Azure
azureSpring = "6.0.0"
azureSpringActiveDirectory = "4.2.0"
azureIdentity = "1.15.0"
microsoftGraph = "6.54.0"

# Security
nimbusJoseJwt = "10.5"

# Code Quality
spotless = "8.0.0"
checkstyle = "12.1.0"

[libraries]
# Spring Boot Starters
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-oauth2-client = { module = "org.springframework.boot:spring-boot-starter-oauth2-client" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-boot-starter-amqp = { module = "org.springframework.boot:spring-boot-starter-amqp" }
spring-boot-starter-reactor-netty = { module = "org.springframework.boot:spring-boot-starter-reactor-netty" }
spring-boot-starter-rsocket = { module = "org.springframework.boot:spring-boot-starter-rsocket" }
spring-boot-devtools = { module = "org.springframework.boot:spring-boot-devtools" }
spring-boot-starter-log4j2 = { module = "org.springframework.boot:spring-boot-starter-log4j2" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }

# Spring Security
spring-security-core = { module = "org.springframework.security:spring-security-core" }
spring-security-config = { module = "org.springframework.security:spring-security-config" }
spring-security-messaging = { module = "org.springframework.security:spring-security-messaging" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }

# Spring Modulith
spring-modulith-starter-core = { module = "org.springframework.modulith:spring-modulith-starter-core" }
spring-modulith-starter-test = { module = "org.springframework.modulith:spring-modulith-starter-test" }

# MyBatis
mybatis-spring-boot-starter = { module = "org.mybatis.spring.boot:mybatis-spring-boot-starter", version.ref = "mybatis" }
mybatis-spring-boot-starter-test = { module = "org.mybatis.spring.boot:mybatis-spring-boot-starter-test", version.ref = "mybatis" }

# Database
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }

# MapStruct
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }

# Lombok
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

# Azure
azure-spring-cloud-starter-active-directory = { module = "com.azure.spring:spring-cloud-azure-starter-active-directory", version.ref = "azureSpringActiveDirectory" }
azure-spring-cloud-starter-keyvault-secrets = { module = "com.azure.spring:spring-cloud-azure-starter-keyvault-secrets", version.ref = "azureSpring" }
azure-identity = { module = "com.azure:azure-identity", version.ref = "azureIdentity" }
microsoft-graph = { module = "com.microsoft.graph:microsoft-graph", version.ref = "microsoftGraph" }

# Security & JWT
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbusJoseJwt" }

# Utilities
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commonsLang3" }

# Testing
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
reactor-test = { module = "io.projectreactor:reactor-test" }

[bundles]
spring-mvc = [
    "spring-boot-starter-web",
    "spring-boot-starter-security",
    "spring-boot-starter-oauth2-client",
    "spring-boot-starter-oauth2-resource-server"
]

spring-webflux = [
    "spring-boot-starter-webflux",
    "spring-boot-starter-reactor-netty",
    "spring-boot-starter-rsocket",
    "spring-boot-starter-security",
    "spring-boot-starter-oauth2-client",
    "spring-boot-starter-oauth2-resource-server",
    "spring-security-messaging"
]

spring-security-core = [
    "spring-security-core",
    "spring-security-config"
]

azure-integration = [
    "azure-spring-cloud-starter-active-directory",
    "azure-spring-cloud-starter-keyvault-secrets",
    "azure-identity",
    "microsoft-graph"
]

mybatis-full = [
    "mybatis-spring-boot-starter",
    "postgresql"
]

testing-common = [
    "spring-boot-starter-test",
    "junit-platform-launcher"
]

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
