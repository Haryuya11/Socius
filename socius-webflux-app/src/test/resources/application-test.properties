spring.cloud.azure.active-directory.profile.tenant-id=dummy-tenant
spring.cloud.azure.active-directory.credential.client-id=dummy-client
spring.cloud.azure.active-directory.credential.client-secret=dummy-secret
azure.domain.name=test.local
# Test database configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Disable SQL initialization for tests
spring.sql.init.mode=never
# Override environment variables for testing
AZURE_TENANT_ID=dummy-tenant
AZURE_CLIENT_ID=dummy-client
AZURE_CLIENT_SECRET=dummy-secret
DB_URL=jdbc:h2:mem:testdb
DB_SCHEMA=PUBLIC
DB_USERNAME=sa
DB_PASSWORD=
