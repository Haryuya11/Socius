plugins {
    id 'java'
}

description = 'socius-webflux-app'

dependencies {
    // Core module
    implementation project(':socius-core-modules')

    // WebFlux specific
    implementation libs.bundles.spring.webflux

    implementation libs.spring.boot.starter.log4j2

    // WebFlux test support
    testImplementation libs.reactor.test
}
