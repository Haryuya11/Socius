spring.application.name=socius-mvc-app
server.port=8080
server.servlet.context-path=/api

## Database Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.hikari.data-source-properties.timezone=Ho_Chi_Minh
spring.datasource.hikari.schema=${DB_SCHEMA}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

## MyBatis Configuration
mybatis.mapper-locations=classpath*:mappers/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# Azure Active Directory configuration
spring.cloud.azure.active-directory.enabled=true
azure.graph.tenant-id=${AZURE_TENANT_ID}
azure.graph.client-id=${AZURE_CLIENT_ID}
azure.graph.client-secret=${AZURE_CLIENT_SECRET}
azure.graph.scope=${AZURE_GRAPH_SCOPE}
azure.graph.domain-name=${AZURE_PRIMARY_DOMAIN}

azure.blob.user.container-name=${AZURE_BLOB_USER_CONTAINER_NAME}
azure.blob.conversation.container-name=${AZURE_BLOB_CONVERSATION_CONTAINER_NAME}
azure.blob.message.container-name=${AZURE_BLOB_MESSAGE_FILE_CONTAINER_NAME}
azure.blob.connection-string=${AZURE_BLOB_CONNECTION_STRING}

#spring.security.oauth2.client.provider.azure.user-info-uri=https://graph.microsoft.com/v1.0/me
logging.level.com.example.azuretest=DEBUG
logging.level.org.springframework.security=DEBUG

# Resource Server JWT Configuration
azure.graph.jwk-set-uri=https://${AZURE_TENANT_ID}.ciamlogin.com/${AZURE_TENANT_ID}/discovery/v2.0/keys
azure.graph.issuer-uri=https://${AZURE_TENANT_ID}.ciamlogin.com/${AZURE_TENANT_ID}/v2.0

# i18n Configuration
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.web.locale=en

#RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL}
#Queue Configuration
rabbitmq.exchange.name=${RABBITMQ_EXCHANGE_NAME}

#Notification Routing Key
notification.routing.key=${NOTIFICATION_ROUTING_KEY}

#Message Routing Key (for realtime messaging to Ktor)
message.routing.key=${MESSAGE_ROUTING_KEY}

# Azure Key Vault Configuration
spring.cloud.azure.keyvault.secret.property-sources[0].endpoint=${KEY_VAULT_ENDPOINT}
spring.cloud.azure.keyvault.secret.property-sources[0].credential.managed-identity-enabled=true
spring.cloud.azure.keyvault.secret.property-source-enabled=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true
management.health.db.enabled=true
management.metrics.enable.jvm=true

# Health check endpoint
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Cache Configuration (TTL in minutes for lightweight memory usage ~400MB VM)
# Permission cache TTL is 2 hours (120 minutes)
app.cache.default-ttl-minutes=120

# Encryption Configuration (AES-256-GCM for message content encryption)
app.encryption.key=${ENCRYPTION_KEY}

#Spring upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=50MB

# Email (SMTP) Configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
mail.from=${MAIL_FROM}