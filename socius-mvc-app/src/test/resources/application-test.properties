# File: `socius-mvc-app/src/test/resources/application-test.properties`

# H2 Database Configuration
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

azure.graph.tenant-id=dummy-tenant
azure.graph.client-id=dummy-client
azure.graph.client-secret=dummy-secret
azure.graph.domain-name=test.local
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=dummy-user
spring.rabbitmq.password=dummy-pass
spring.rabbitmq.ssl.enabled=false
rabbitmq.exchange.name=socius-exchange-test
notification.routing.key=notification.test.key
spring.cloud.azure.keyvault.secret.property-source-enabled=false

# OAuth2 Resource Server (use local dummy endpoints so jwk-set-uri is not empty)
azure.graph.issuer-uri=http://localhost/.well-known/openid-configuration
azure.graph.jwk-set-uri=http://localhost/keys
azure.graph.scope=https://dummy-scope/.default

# Azure Blob Storage Configuration (dummy)
azure.blob.user.container-name=test-container
azure.blob.connection-string=DefaultEndpointsProtocol=https;AccountName=dummyaccount;AccountKey=dummykey;EndpointSuffix=core.windows.net
