# File: `socius-mvc-app/src/test/resources/application-test.properties`
spring.cloud.azure.active-directory.profile.tenant-id=dummy-tenant
spring.cloud.azure.active-directory.credential.client-id=dummy-client
spring.cloud.azure.active-directory.credential.client-secret=dummy-secret
azure.domain.name=test.local
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=dummy-user
spring.rabbitmq.password=dummy-pass
spring.cloud.azure.keyvault.secret.property-source-enabled=false

# OAuth2 Resource Server (use local dummy endpoints so jwk-set-uri is not empty)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost/.well-known/openid-configuration
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost/keys

# OAuth2 Client (dummy)
spring.security.oauth2.client.registration.azure.client-id=dummy-client
spring.security.oauth2.client.registration.azure.client-secret=dummy-secret
spring.security.oauth2.client.provider.azure.authorization-uri=http://localhost/auth
spring.security.oauth2.client.provider.azure.token-uri=http://localhost/token
spring.security.oauth2.client.provider.azure.jwk-set-uri=http://localhost/keys

# Azure Blob Storage Configuration (dummy)
azure.blob.user.container-name=test-container
azure.blob.connection-string=DefaultEndpointsProtocol=https;AccountName=dummyaccount;AccountKey=dummykey;EndpointSuffix=core.windows.net
