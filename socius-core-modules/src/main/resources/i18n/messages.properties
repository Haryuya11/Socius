## Success
S_EMP_001=Employee created successfully.
S_EMP_002=Employee updated successfully.
S_EMP_003=Employee deactivated successfully.
S_EMP_004=Employee details retrieved successfully.
S_EMP_005=Employee change password successfully.
S_EMP_006=Employee profile retrieved successfully.
S_EMP_007=Employees list retrieved successfully.
##Warning
W_EMP_001=Employee with the same ID already exists.
W_EMP_002=Employee not found.

