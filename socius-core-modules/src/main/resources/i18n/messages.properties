## Employee Module Messages
## Error
E_EMP_001=Failed to create employee.
E_EMP_002=Failed to update employee.
E_EMP_003=Failed to deactivate employee.
E_EMP_004=Failed to retrieve employee details.
E_EMP_005=Failed to reactivate employee.
